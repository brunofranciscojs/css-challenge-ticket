<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Chalenge - Train Tickets</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="place-content-center h-dvh font-['system-ui'] bg-yellow-300 overflow-x-hidden [&_*]:font-['Roboto']">
  <div id="browser-support-warning"
    class="hidden fixed top-0 left-0 w-full z-[9999] bg-white/80 backdrop-blur-md p-4 text-center animate-in fade-in slide-in-from-top duration-500">
    <div class="max-w-[1200px] mx-auto flex flex-col md:flex-row items-center justify-center gap-4">
      <div class="bg-amber-100 p-2 rounded-full text-amber-600">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-alert-triangle">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
          <path d="M12 9v4" />
          <path d="M12 17h.01" />
        </svg>
      </div>
      <div>
        <p class="font-bold text-gray-900 border-none!">Funcionalidade Experimental Detectada</p>
        <p class="text-sm text-gray-600">Este projeto utiliza <code
            class="bg-gray-100 px-1 rounded text-pink-600 font-mono">scroll-marker-group</code>, uma feature
          experimental que seu navegador pode não suportar totalmente ainda.</p>
      </div>
      <div class="flex flex-wrap justify-center gap-3 mt-2 md:mt-0">
        <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/scroll-marker-group" target="_blank"
          class="px-3 py-1.5 bg-gray-900 text-white rounded-lg text-xs font-semibold hover:bg-gray-700 transition-colors flex items-center gap-1.5">
          MDN Docs
        </a>
        <a href="https://developer.chrome.com/blog/carousels-with-css" target="_blank"
          class="px-3 py-1.5 bg-[#4285f4] text-white rounded-lg text-xs font-semibold hover:bg-[#1a73e8] transition-colors flex items-center gap-1.5">
          Chrome Devs
        </a>
        <a href="https://caniuse.com/css-scroll-marker-group" target="_blank"
          class="px-3 py-1.5 bg-[#db562b] text-white rounded-lg text-xs font-semibold hover:bg-[#c04a25] transition-colors flex items-center gap-1.5">
          Can I Use
        </a>
      </div>
    </div>
  </div>
  <main
    class="mx-auto flex overflow-x-scroll gap-12 p-8 w-full [&::-webkit-scrollbar]:w-0 max-w-[1440px] [anchor-name:--carrossel] snap-mandatory [scroll-marker-group:after] [container-type:inline-size] [overscroll-behavior-x:contain]">
  </main>
  <script src="./script.js"></script>
</body>

</html>
